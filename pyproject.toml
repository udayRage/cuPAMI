[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cupami"
version = "0.1.0"
description = "CUDA accelerated pattern mining algorithms"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "UdayLab" }]
keywords = ["CUDA", "GPU", "pattern mining", "frequent itemsets"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
cuda12 = ["cupy-cuda12x>=12"]
cuda13 = ["cupy-cuda13x>=13"]
parquet = ["pyarrow>=12"]
memory = ["psutil>=5"]
all = ["cupy-cuda12x>=12", "pyarrow>=12", "psutil>=5"]
dev = ["build", "twine"]

[project.urls]
Homepage = "https://github.com/udayRage/cuPAMI"
Repository = "https://github.com/udayRage/cuPAMI"
Issues = "https://github.com/udayRage/cuPAMI/issues"

[tool.setuptools.packages.find]
include = ["cupami*"]

[tool.setuptools.exclude-package-data]
"*" = ["__pycache__/*", "*.py[cod]"]
